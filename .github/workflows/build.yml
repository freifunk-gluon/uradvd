name: compile-uradvd
run-name: Compile uradvd

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: 'CFLAGS=-Werror make'
      - name: Upload compiled uradvd
        uses: actions/upload-artifact@v7
        with:
          name: uradvd
          path: uradvd
  verify-usage:
    runs-on: ubuntu-latest
    needs: 'build'
    steps:
      - uses: actions/checkout@v7

      - name: Download compiled uradvd
        uses: actions/download-artifact@v8
        with:
          name: uradvd

      - name: Restore executable permission
        run: chmod u+x uradvd

      - name: Verify usage lines are in README
        run: '! grep -vxFf README.md <(./uradvd -h 2>&1)'

      - name: Verify usage lines are less or equal of length 80
        run: '[ $(./uradvd -h 2>&1 | wc -L) -le 80 ]'
